org.gradle.jvmargs=-Xmx4G
org.gradle.caching=true
org.gradle.parallel=true


# ForgeGradle 7 wants the two source sets joined, otherwise the run configs it
# generates cannot see the mod's resources.
net.minecraftforge.gradle.merge-source-sets=true

minecraft_version=1.21.11
minecraft_version_range=[1.21.11,1.22)
forge_version=61.2.1
forge_version_range=[61,)
loader_version_range=[61,)

# Mojang's own names, as on 1.16.5. On this version they are not merely
# convenient: Forge runs on them at run time too, so a mixin written against
# them needs no refmap at all.
mapping_channel=official
mapping_version=1.21.11

# The same id as the other two builds. They are one mod and never run side by
# side, so a player moving between game versions keeps their settings.
mod_id=vulkanmodnext
mod_name=VulkanMod Next
mod_license=LGPL-3.0-only
mod_version=0.1.0-alpha.1
mod_group_id=net.vulkanmodnext
mod_authors=VLOD-ZDOV
mod_description=Draws the world with Vulkan instead of OpenGL. This is the 1.21.11 build - the newest and the least finished of the three.
