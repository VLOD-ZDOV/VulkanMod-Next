plugins {
    id 'java'
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[7.0.23,8.0)'
}

version = mod_version
group = mod_group_id
base { archivesName = "${mod_id}-${minecraft_version}" }

// The game is Java 21 from 1.20.5 on. Gradle itself runs on whatever is around;
// the toolchain below is the one the mod is compiled and run with.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

minecraft {
    mappings channel: mapping_channel, version: mapping_version

    // ForgeGradle unpacks Minecraft and Forge into a little Maven repository of
    // its own and puts it under the project's .gradle directory. Those jars go
    // straight onto the game's class path, and Forge's mod scanner turns every
    // class path entry into a URL and back with Path.of(URI) — a round trip
    // that does not survive a non-ASCII directory name. The game dies before it
    // starts with "IllegalArgumentException: Bad escape", from inside
    // ClasspathLocator, naming nothing at all.
    //
    // So the repository is moved out from under the Cyrillic path, exactly like
    // the build directory above and for the same reason.
    mavenizerOutput = file(System.getProperty('user.home')
            + '/.cache/vulkanmodnext/1.21.11/mavenizer/repo')

    runs {
        configureEach {
            // Under the build directory for the same reason as the build
            // directory itself: the game writes its saves, logs and options
            // here, and the path has to be one every library in the stack can
            // spell.
            workingDir.convention layout.buildDirectory.dir('run')
            // Forge has no MixinGradle here, so the config is named on the
            // command line for the dev client and in the manifest for the jar.
            args "--mixin.config=${mod_id}.mixins.json"
        }
        register('client') {
            // Same reason as on the other two versions: without these OpenGL
            // goes to Mesa while Vulkan takes the discrete card, and the two
            // halves of the interop then belong to different devices.
            environment '__NV_PRIME_RENDER_OFFLOAD', '1'
            environment '__GLX_VENDOR_LIBRARY_NAME', 'nvidia'
            // The stack size is NOT set here on purpose. It is set by VkStack,
            // from inside the mod, and leaving the dev client without the flag
            // is what keeps that honest: if the replacement stops working, this
            // run fails rather than quietly passing on a flag a player would
            // never have.
            // -Pworld=<name> opens a world by itself. Nothing interesting
            // happens in this mod until sections are being built.
            if (project.hasProperty('world')) {
                systemProperty 'vulkanmodnext.world', project.property('world')
            }
            // -Pterrain=on draws the world through Vulkan for this run. It
            // writes no config file: the switch a player sees is separate, and
            // a test that changes their settings is not a test.
            if (project.hasProperty('terrain')) {
                systemProperty 'vulkanmodnext.terrain', project.property('terrain')
            }
            // -Pbudget=<MiB> caps the section geometry buffer, for when
            // something else on the machine has the card.
            if (project.hasProperty('budget')) {
                jvmArgs '-Dvulkanmodnext.geometryBudget=' + project.property('budget')
            }
            // -Pvalidation turns the Khronos validation layer on. It is the
            // instrument that speaks when a driver would rather carry on: a
            // frame that draws nothing and reports no error is exactly what it
            // exists for.
            if (project.hasProperty('validation')) {
                jvmArgs '-Dvulkanmodnext.validation=true'
            }
            // -Pcompact=off keeps the vanilla-shaped vertex instead of packing
            // it to sixteen bytes. The packing is the most version-specific
            // thing in the port, so it is the first thing to take away.
            if (project.hasProperty('compact')) {
                jvmArgs '-Dvulkanmodnext.compactVertices=' +
                        (project.property('compact') == 'off' ? 'false' : 'true')
            }
            // -Pshow=materials paints the terrain by material instead of by
            // texture. A separating experiment, not a feature.
            if (project.hasProperty('show')) {
                jvmArgs '-Dvulkanmodnext.show' +
                        project.property('show').capitalize() + '=true'
            }
        }
    }
}

configurations {
    // Put inside the jar rather than merely on the compile path. Declared above
    // the dependencies block that uses it, because this file is read in order.
    bundled
}

repositories {
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    mavenCentral()
}

dependencies {
    implementation minecraft.dependency("net.minecraftforge:forge:${minecraft_version}-${forge_version}")

    // The game ships LWJGL 3.3.3 core, GLFW, OpenGL, STB, OpenAL and freetype —
    // but not the Vulkan bindings, because it has no use for them. They are a
    // pure Java jar with no natives of their own: they bind to the system's
    // libvulkan through the loader the game has already started.
    //
    // Pinned to the game's own LWJGL version. Unlike 3.2.2 on 1.16.5, this one
    // has every class the Vulkan half of the mod names, ray tracing included.
    implementation 'org.lwjgl:lwjgl-vulkan:3.3.3'
    bundled 'org.lwjgl:lwjgl-vulkan:3.3.3'

    // No Mixin annotation processor, and that is the version talking rather
    // than a shortcut. Its job is to write a refmap — a table from the names a
    // mixin is compiled against to the obfuscated ones it must find at run
    // time. Forge runs on Mojang's own names here, so the two are the same
    // table and there is nothing to write; the processor, handed no mapping
    // file at all, refuses every @Inject it cannot remap.
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('processResources', ProcessResources).configure {
    var replacements = [
            minecraft_version       : minecraft_version,
            minecraft_version_range : minecraft_version_range,
            forge_version           : forge_version,
            forge_version_range     : forge_version_range,
            loader_version_range    : loader_version_range,
            mod_id                  : mod_id,
            mod_name                : mod_name,
            mod_license             : mod_license,
            mod_version             : mod_version,
            mod_authors             : mod_authors,
            mod_description         : mod_description,
    ]
    inputs.properties replacements
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replacements
    }
}

tasks.named('jar', Jar).configure {
    // The Vulkan bindings travel in the jar.
    //
    // Minecraft ships LWJGL's core, GLFW, OpenGL, STB, OpenAL and freetype, and
    // not this: it has no use for Vulkan. In the development client that goes
    // unnoticed, because Gradle puts every declared dependency on the class
    // path — the first jar built for 1.16.5 had none of these classes in it at
    // all, and would have died on the first Vulkan call in anybody's instance.
    from({ configurations.bundled.collect { zipTree(it) } }) {
        // A signature that describes somebody else's jar, and a module
        // declaration that means nothing inside ours.
        exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA', 'module-info.class'
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    manifest {
        attributes([
                // Without this the mixins are never loaded. In the development
                // client they are, because the run config names the config on
                // the command line — so the jar looks fine, starts fine, and
                // does nothing at all, which is a failure this project has
                // shipped once already.
                'MixinConfigs'            : "${mod_id}.mixins.json",
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : mod_name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
        ])
    }
}

// Puts the decompiled game under build/mc-src.
//
// The port is mostly reading vanilla and reattaching to it, and this project
// has a standing rule about that: read the sources on this disk, not the web
// and not from memory.
tasks.register('mcSources', Copy) {
    group 'documentation'
    description 'Unpacks the decompiled Minecraft and Forge into build/mc-src.'
    from { zipTree(minecraft.mavenizerOutput.get().file("net/minecraftforge/forge/${minecraft_version}-${forge_version}/forge-${minecraft_version}-${forge_version}-sources.jar")) }
    into 'build/mc-src'
}
